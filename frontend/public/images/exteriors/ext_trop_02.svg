<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad_ext_trop_02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="groundGrad_ext_trop_02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <pattern id="louvers_ext_trop_02" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#A07144" stroke-width="3" stroke-opacity="0.4"/>
    </pattern>
    <filter id="shadow_ext_trop_02" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="640" height="420" fill="url(#skyGrad_ext_trop_02)"/>

  <!-- Architectural Grid Backdrop -->
  <line x1="40" y1="80" x2="600" y2="80" stroke="#334155" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <line x1="40" y1="180" x2="600" y2="180" stroke="#334155" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <line x1="40" y1="280" x2="600" y2="280" stroke="#334155" stroke-dasharray="4 4" stroke-opacity="0.4"/>

  <!-- Ground Plane & Pavers -->
  <rect x="0" y="350" width="640" height="70" fill="url(#groundGrad_ext_trop_02)"/>
  <line x1="0" y1="350" x2="640" y2="350" stroke="#475569" stroke-width="2"/>
  
  <!-- Boundary Gate & Lawn Accents -->
  <rect x="40" y="325" width="560" height="25" fill="#1E293B" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" rx="2"/>
  <circle cx="90" cy="370" r="6" fill="#10B981" fill-opacity="0.8"/>
  <circle cx="115" cy="368" r="8" fill="#059669" fill-opacity="0.9"/>
  <circle cx="530" cy="370" r="7" fill="#10B981" fill-opacity="0.8"/>
  <circle cx="555" cy="366" r="9" fill="#059669" fill-opacity="0.9"/>

  <!-- Main House Massing Silhouette -->
  <g filter="url(#shadow_ext_trop_02)">
    <!-- Main Wall Block -->
    <rect x="90" y="130" width="460" height="220" fill="#DAD6CD" stroke="#64748B" stroke-width="2" rx="4"/>
    
    <!-- Pattern / Louver Overlays -->
    <rect x="110" y="150" width="100" height="190" fill="url(#louvers_ext_trop_02)" rx="2"/>
    
    <!-- Accent Architectural Mass -->
    <rect x="210" y="160" width="180" height="110" fill="#A07144" fill-opacity="0.85" rx="4"/>

    <!-- Ground Floor Entrance & Pivot Door -->
    <rect x="285" y="265" width="50" height="85" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" rx="2"/>
    <rect x="290" y="270" width="40" height="80" fill="#0F172A" rx="1"/>
    <line x1="323" y1="305" x2="323" y2="320" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Large Format Architectural Glazing -->
    <rect x="130" y="275" width="110" height="65" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2" rx="2"/>
    <line x1="185" y1="275" x2="185" y2="340" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- First Floor Fenestration / Ribbon Window -->
    <rect x="130" y="170" width="120" height="70" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2" rx="2"/>
    <rect x="360" y="175" width="150" height="65" fill="#0EA5E9" fill-opacity="0.25" stroke="#38BDF8" stroke-width="2" rx="2"/>

    <!-- Balcony & Railing Profile -->
    <rect x="350" y="240" width="170" height="12" fill="#A07144" stroke="#94A3B8" stroke-width="1.5" rx="2"/>
    <rect x="355" y="215" width="160" height="25" fill="#38BDF8" fill-opacity="0.3" stroke="#CBD5E1" stroke-width="1.5" rx="1"/>
    
    <!-- Exterior Architectural Grazers (Lighting Glows) -->
    <circle cx="125" cy="330" r="14" fill="#FDE047" fill-opacity="0.18"/>
    <circle cx="255" cy="330" r="14" fill="#FDE047" fill-opacity="0.18"/>
    <circle cx="345" cy="330" r="14" fill="#FDE047" fill-opacity="0.18"/>
    <circle cx="525" cy="330" r="14" fill="#FDE047" fill-opacity="0.18"/>
  </g>

  <!-- Top Badges & Details -->
  <rect x="24" y="24" width="170" height="26" fill="#14B8A6" fill-opacity="0.2" rx="6" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="34" y="42" fill="#14B8A6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TROPICAL CONTEMPORARY</text>

  <rect x="204" y="24" width="85" height="26" fill="#334155" fill-opacity="0.6" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="214" y="42" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Premium</text>

  <!-- Architectural Reference Image Pill Indicator -->
  <rect x="420" y="24" width="195" height="26" fill="#0F172A" fill-opacity="0.85" rx="6" stroke="#475569" stroke-width="1"/>
  <circle cx="432" cy="37" r="4" fill="#38BDF8"/>
  <text x="442" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">ARCHITECTURAL REFERENCE</text>

  <!-- Bottom Title Bar -->
  <rect x="24" y="365" width="592" height="38" fill="#0B1120" fill-opacity="0.9" rx="8" stroke="#334155" stroke-width="1"/>
  <text x="40" y="389" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Bio-Tropical Slatted Timber Residence</text>
  <text x="596" y="389" text-anchor="end" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tropical Contemporary • G+2</text>
</svg>