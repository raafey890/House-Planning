<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e252b" />
      <stop offset="100%" stop-color="#11161b" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#a0aec0" />
    </linearGradient>

    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f2f2f2" />
      <stop offset="70%" stop-color="#e8e8e8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Room Shell & Wall Plane -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect x="80" y="40" width="640" height="340" fill="#edf2f7" rx="6" opacity="0.95" />
  <line x1="80" y1="40" x2="80" y2="380" stroke="#4a5568" stroke-width="2" />
  <line x1="720" y1="40" x2="720" y2="380" stroke="#4a5568" stroke-width="2" />

  <!-- Floor Plane with Perspective Lines -->
  <polygon points="80,380 720,380 780,480 20,480" fill="url(#floorGrad)" />
  <line x1="80" y1="380" x2="720" y2="380" stroke="#1a202c" stroke-width="2.5" />
  <line x1="240" y1="380" x2="200" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="400" y1="380" x2="400" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="560" y1="380" x2="600" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />

  <!-- Distinct Architectural Features -->
  
        <g id="bedroom-bed">
            <rect x="220" y="110" width="360" height="180" rx="8" fill="#4299e1" stroke="#a0aec0" stroke-width="2" />
            <line x1="280" y1="110" x2="280" y2="290" stroke="#a0aec0" stroke-width="1.5" />
            <line x1="340" y1="110" x2="340" y2="290" stroke="#a0aec0" stroke-width="1.5" />
            <line x1="400" y1="110" x2="400" y2="290" stroke="#a0aec0" stroke-width="1.5" />
            <line x1="460" y1="110" x2="460" y2="290" stroke="#a0aec0" stroke-width="1.5" />
            <line x1="520" y1="110" x2="520" y2="290" stroke="#a0aec0" stroke-width="1.5" />
            <rect x="250" y="280" width="300" height="90" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="2" />
            <rect x="270" y="250" width="110" height="35" rx="6" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" />
            <rect x="420" y="250" width="110" height="35" rx="6" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1.5" />
            <rect x="250" y="330" width="300" height="35" rx="4" fill="#3182ce" opacity="0.8" />
            <rect x="150" y="300" width="60" height="50" rx="4" fill="#2d3748" stroke="#a0aec0" stroke-width="1" />
            <rect x="590" y="300" width="60" height="50" rx="4" fill="#2d3748" stroke="#a0aec0" stroke-width="1" />
            <line x1="180" y1="0" x2="180" y2="220" stroke="#a0aec0" stroke-width="1.5" />
            <circle cx="180" cy="225" r="12" fill="#fff" filter="url(#glow)" />
            <line x1="620" y1="0" x2="620" y2="220" stroke="#a0aec0" stroke-width="1.5" />
            <circle cx="620" cy="225" r="12" fill="#fff" filter="url(#glow)" />
        </g>
        

  <!-- Studio Header Overlay -->
  <g id="badge" transform="translate(30, 30)">
    <rect width="210" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="14" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">GUEST ROOM</text>
    <text x="14" y="33" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Compact Multipurpose Guest Room</text>
  </g>

  <!-- Budget Tier Pill -->
  <g id="tier-pill" transform="translate(680, 30)">
    <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#3182ce" stroke-width="1.5" />
    <text x="45" y="18" fill="#3182ce" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Economy</text>
  </g>

  <!-- Unique Stable ID -->
  <g id="id-tag" transform="translate(710, 460)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="12" font-weight="600">int_guest_04</text>
  </g>
</svg>