<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222a" />
      <stop offset="100%" stop-color="#14171d" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4452" />
      <stop offset="100%" stop-color="#22262f" />
    </linearGradient>

    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f2f2f2" />
      <stop offset="70%" stop-color="#e8e8e8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Room Shell & Wall Plane -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect x="80" y="40" width="640" height="340" fill="#2c313c" rx="6" opacity="0.95" />
  <line x1="80" y1="40" x2="80" y2="380" stroke="#4a5568" stroke-width="2" />
  <line x1="720" y1="40" x2="720" y2="380" stroke="#4a5568" stroke-width="2" />

  <!-- Floor Plane with Perspective Lines -->
  <polygon points="80,380 720,380 780,480 20,480" fill="url(#floorGrad)" />
  <line x1="80" y1="380" x2="720" y2="380" stroke="#1a202c" stroke-width="2.5" />
  <line x1="240" y1="380" x2="200" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="400" y1="380" x2="400" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="560" y1="380" x2="600" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />

  <!-- Distinct Architectural Features -->
  
        <g id="accent-layer">
            <rect x="170" y="110" width="270" height="240" rx="8" fill="#181c24" opacity="0.9" />
            <rect x="180" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="196" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="212" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="228" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="244" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="260" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="276" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="292" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="308" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="324" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="340" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="356" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="372" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="388" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="404" y="120" width="8" height="220" rx="2" fill="#1f232b" /><rect x="420" y="120" width="8" height="220" rx="2" fill="#1f232b" />
            <rect x="200" y="150" width="210" height="120" rx="6" fill="#0b0d12" stroke="#2d3748" stroke-width="3" />
            <rect x="205" y="155" width="200" height="110" rx="4" fill="url(#screenGrad)" />
            <rect x="180" y="300" width="250" height="35" rx="4" fill="#2d3748" stroke="#63b3ed" stroke-width="1.5" />
            <ellipse cx="305" cy="210" rx="90" ry="50" fill="#63b3ed" opacity="0.18" filter="url(#glow)" />
            <path d="M 460 310 L 680 310 L 680 390 L 590 390 L 590 410 L 460 410 Z" fill="#4a5568" rx="6" />
            <rect x="470" y="270" width="130" height="40" rx="6" fill="#313947" />
            <rect x="610" y="270" width="60" height="40" rx="6" fill="#313947" />
            <circle cx="530" cy="370" r="28" fill="#1a202c" stroke="#a0aec0" stroke-width="2" />
            <circle cx="565" cy="380" r="18" fill="#2d3748" />
        </g>
        

  <!-- Studio Header Overlay -->
  <g id="badge" transform="translate(30, 30)">
    <rect width="210" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="14" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">LIVING ROOM</text>
    <text x="14" y="33" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Modern Contemporary Living Room</text>
  </g>

  <!-- Budget Tier Pill -->
  <g id="tier-pill" transform="translate(680, 30)">
    <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#63b3ed" stroke-width="1.5" />
    <text x="45" y="18" fill="#63b3ed" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Mid-Range</text>
  </g>

  <!-- Unique Stable ID -->
  <g id="id-tag" transform="translate(710, 460)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="12" font-weight="600">int_lr_01</text>
  </g>
</svg>