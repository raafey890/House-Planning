<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1a17" />
      <stop offset="100%" stop-color="#0f0e0c" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfdcd7" />
      <stop offset="100%" stop-color="#b8b2a8" />
    </linearGradient>

    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f2f2f2" />
      <stop offset="70%" stop-color="#e8e8e8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Room Shell & Wall Plane -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect x="80" y="40" width="640" height="340" fill="#262320" rx="6" opacity="0.95" />
  <line x1="80" y1="40" x2="80" y2="380" stroke="#4a5568" stroke-width="2" />
  <line x1="720" y1="40" x2="720" y2="380" stroke="#4a5568" stroke-width="2" />

  <!-- Floor Plane with Perspective Lines -->
  <polygon points="80,380 720,380 780,480 20,480" fill="url(#floorGrad)" />
  <line x1="80" y1="380" x2="720" y2="380" stroke="#1a202c" stroke-width="2.5" />
  <line x1="240" y1="380" x2="200" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="400" y1="380" x2="400" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="560" y1="380" x2="600" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />

  <!-- Distinct Architectural Features -->
  
        <g id="accent-layer">
            <rect x="180" y="110" width="280" height="240" rx="6" fill="url(#marbleGrad)" stroke="#d69e2e" stroke-width="3" />
            <path d="M 190 120 Q 230 180 270 200 T 310 280 T 330 350" stroke="#718096" stroke-width="2.5" fill="none" opacity="0.45" />
            <path d="M 450 120 Q 410 180 370 200 T 330 280 T 310 350" stroke="#718096" stroke-width="2.5" fill="none" opacity="0.45" />
            <line x1="180" y1="120" x2="180" y2="340" stroke="#d69e2e" stroke-width="2.5" />
            <line x1="460" y1="120" x2="460" y2="340" stroke="#d69e2e" stroke-width="2.5" />
            <path d="M 480 320 C 520 280, 640 280, 680 320 L 670 400 C 630 380, 530 380, 490 400 Z" fill="#2d3748" stroke="#d69e2e" stroke-width="1.5" />
            <circle cx="400" cy="80" r="45" fill="none" stroke="#d69e2e" stroke-width="4" filter="url(#glow)" />
            <circle cx="400" cy="80" r="30" fill="none" stroke="#d69e2e" stroke-width="2" />
            <circle cx="400" cy="80" r="5" fill="#ffffff" filter="url(#glow)" />
        </g>
        

  <!-- Studio Header Overlay -->
  <g id="badge" transform="translate(30, 30)">
    <rect width="210" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="14" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">LIVING ROOM</text>
    <text x="14" y="33" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Luxury Marble Living Room</text>
  </g>

  <!-- Budget Tier Pill -->
  <g id="tier-pill" transform="translate(680, 30)">
    <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#ecc94b" stroke-width="1.5" />
    <text x="45" y="18" fill="#ecc94b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Luxury</text>
  </g>

  <!-- Unique Stable ID -->
  <g id="id-tag" transform="translate(710, 460)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="12" font-weight="600">int_lr_02</text>
  </g>
</svg>