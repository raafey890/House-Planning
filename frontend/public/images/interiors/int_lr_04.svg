<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26190f" />
      <stop offset="100%" stop-color="#140c06" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a532d" />
      <stop offset="100%" stop-color="#593318" />
    </linearGradient>

    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f2f2f2" />
      <stop offset="70%" stop-color="#e8e8e8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Room Shell & Wall Plane -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect x="80" y="40" width="640" height="340" fill="#382315" rx="6" opacity="0.95" />
  <line x1="80" y1="40" x2="80" y2="380" stroke="#4a5568" stroke-width="2" />
  <line x1="720" y1="40" x2="720" y2="380" stroke="#4a5568" stroke-width="2" />

  <!-- Floor Plane with Perspective Lines -->
  <polygon points="80,380 720,380 780,480 20,480" fill="url(#floorGrad)" />
  <line x1="80" y1="380" x2="720" y2="380" stroke="#1a202c" stroke-width="2.5" />
  <line x1="240" y1="380" x2="200" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="400" y1="380" x2="400" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="560" y1="380" x2="600" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />

  <!-- Distinct Architectural Features -->
  
        <g id="accent-layer">
            <rect x="170" y="105" width="260" height="240" rx="6" fill="#4d2810" />
            <rect x="175" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="193" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="211" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="229" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="247" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="265" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="283" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="301" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="319" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="337" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="355" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="373" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="391" y="110" width="10" height="230" rx="3" fill="#8a4d21" /><rect x="409" y="110" width="10" height="230" rx="3" fill="#8a4d21" />
            <rect x="190" y="295" width="220" height="40" rx="4" fill="#2d170a" stroke="#d69e2e" stroke-width="2" />
            <rect x="500" y="280" width="110" height="90" rx="16" fill="#8a441a" stroke="#d69e2e" stroke-width="1.5" />
            <rect x="485" y="300" width="22" height="60" rx="8" fill="#5e2b0e" />
            <rect x="603" y="300" width="22" height="60" rx="8" fill="#5e2b0e" />
        </g>
        

  <!-- Studio Header Overlay -->
  <g id="badge" transform="translate(30, 30)">
    <rect width="210" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="14" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">LIVING ROOM</text>
    <text x="14" y="33" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Warm Wood Living Room</text>
  </g>

  <!-- Budget Tier Pill -->
  <g id="tier-pill" transform="translate(680, 30)">
    <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#ed8936" stroke-width="1.5" />
    <text x="45" y="18" fill="#ed8936" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Premium</text>
  </g>

  <!-- Unique Stable ID -->
  <g id="id-tag" transform="translate(710, 460)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="12" font-weight="600">int_lr_04</text>
  </g>
</svg>