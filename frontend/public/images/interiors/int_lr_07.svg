<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23282e" />
      <stop offset="100%" stop-color="#181b20" />
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e0" />
      <stop offset="100%" stop-color="#a0aec0" />
    </linearGradient>

    <!-- Marble Texture Gradient -->
    <linearGradient id="marbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f2f2f2" />
      <stop offset="70%" stop-color="#e8e8e8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Glass Partition Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#63b3ed" stop-opacity="0.20" />
    </linearGradient>

    <!-- TV Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <!-- Lighting Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Room Shell & Atmosphere -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Wall Plane -->
  <rect x="80" y="40" width="640" height="340" fill="#edf2f7" rx="6" opacity="0.95" />
  <line x1="80" y1="40" x2="80" y2="380" stroke="#4a5568" stroke-width="2" />
  <line x1="720" y1="40" x2="720" y2="380" stroke="#4a5568" stroke-width="2" />

  <!-- Floor Plane with Perspective Tiling -->
  <polygon points="80,380 720,380 780,480 20,480" fill="url(#floorGrad)" />
  <line x1="80" y1="380" x2="720" y2="380" stroke="#1a202c" stroke-width="2.5" />
  <line x1="240" y1="380" x2="200" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="400" y1="380" x2="400" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />
  <line x1="560" y1="380" x2="600" y2="480" stroke="#000000" stroke-width="0.8" opacity="0.3" />

  <!-- 2. Distinct Architectural Features -->
  
        <g id="ceiling-specialty">
            <!-- Suspended Ceiling Fascia -->
            <rect x="150" y="50" width="500" height="60" rx="4" fill="#e2e8f0" stroke="#a0aec0" stroke-width="2" />
            <!-- Integrated Light Channel Glow -->
            <rect x="180" y="95" width="440" height="12" rx="4" fill="#48bb78" filter="url(#glow)" />
            <!-- Spotlights -->
            <circle cx="240" cy="75" r="8" fill="#ffffff" filter="url(#glow)" />
            <circle cx="350" cy="75" r="8" fill="#ffffff" filter="url(#glow)" />
            <circle cx="450" cy="75" r="8" fill="#ffffff" filter="url(#glow)" />
            <circle cx="560" cy="75" r="8" fill="#ffffff" filter="url(#glow)" />
            <!-- Ceiling Rafters or Magnetic Track if applicable -->
            <line x1="200" y1="80" x2="600" y2="80" stroke="#1a202c" stroke-width="6" />
            <!-- Architectural perspective cones -->
            <polygon points="240,75 190,260 290,260" fill="#48bb78" opacity="0.12" />
            <polygon points="450,75 400,260 500,260" fill="#48bb78" opacity="0.12" />
        </g>
        

  <!-- 3. Studio Badge Overlay -->
  <g id="badge" transform="translate(30, 30)">
    <rect width="180" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="14" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">LIVING ROOM</text>
    <text x="14" y="33" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Compact Budget-Friendly</text>
  </g>

  <!-- Budget Tier Pill -->
  <g id="tier-pill" transform="translate(680, 30)">
    <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#48bb78" stroke-width="1.5" />
    <text x="45" y="18" fill="#48bb78" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Economy</text>
  </g>

  <!-- ID Tag -->
  <g id="id-tag" transform="translate(710, 460)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="12" font-weight="600">int_lr_07</text>
  </g>
</svg>